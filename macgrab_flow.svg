<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="470" fill="#1e1e2e" rx="12"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#cdd6f4" letter-spacing="1">MacGrab — Process Flow</text>

  <!-- ═══════════════════════════════════════
       DEFS: arrowheads
  ══════════════════════════════════════════ -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#7c6af7"/>
    </marker>
    <marker id="arre" markerWidth="9" markerHeight="9" refX="4.5" refY="9" orient="auto">
      <path d="M0,0 L9,0 L4.5,9 z" fill="#f38ba8"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════
       ROW 1 — Steps ①–⑤   (y=55, left→right)
  ══════════════════════════════════════════ -->

  <!-- Step 1 -->
  <rect x="10"  y="55" width="155" height="70" rx="9" fill="#7c6af7"/>
  <text x="87"  y="82"  text-anchor="middle" font-size="20" fill="#fff">①</text>
  <text x="87"  y="99"  text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Preflight</text>
  <text x="87"  y="114" text-anchor="middle" font-size="9.5" fill="#e0e0ff">root + macOS ≥ 10.14</text>
  <!-- error exit ↓ -->
  <line x1="87" y1="125" x2="87" y2="148" stroke="#f38ba8" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arre)"/>
  <rect x="10"  y="148" width="155" height="28" rx="5" fill="#2e1a1a" stroke="#f38ba8" stroke-width="1.1"/>
  <text x="87"  y="167" text-anchor="middle" font-size="9.5" fill="#f38ba8">❌ not root / old OS</text>

  <!-- Arrow 1→2 -->
  <line x1="165" y1="90" x2="184" y2="90" stroke="#7c6af7" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="184" y="55" width="155" height="70" rx="9" fill="#5b4dd6"/>
  <text x="261"  y="82"  text-anchor="middle" font-size="20" fill="#fff">②</text>
  <text x="261"  y="99"  text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Create Snapshot</text>
  <text x="261"  y="114" text-anchor="middle" font-size="9.5" fill="#e0e0ff">tmutil localsnapshot</text>
  <!-- error exit ↓ -->
  <line x1="261" y1="125" x2="261" y2="148" stroke="#f38ba8" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arre)"/>
  <rect x="184" y="148" width="155" height="28" rx="5" fill="#2e1a1a" stroke="#f38ba8" stroke-width="1.1"/>
  <text x="261" y="167" text-anchor="middle" font-size="9.5" fill="#f38ba8">❌ snapshot failed</text>

  <!-- Arrow 2→3 -->
  <line x1="339" y1="90" x2="358" y2="90" stroke="#7c6af7" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="358" y="55" width="155" height="70" rx="9" fill="#5b4dd6"/>
  <text x="435"  y="82"  text-anchor="middle" font-size="20" fill="#fff">③</text>
  <text x="435"  y="99"  text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Mount Snapshot</text>
  <text x="435"  y="114" text-anchor="middle" font-size="9.5" fill="#e0e0ff">/tmp/tm_snapshot</text>
  <!-- error exit ↓ -->
  <line x1="435" y1="125" x2="435" y2="148" stroke="#f38ba8" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arre)"/>
  <rect x="358" y="148" width="155" height="28" rx="5" fill="#2e1a1a" stroke="#f38ba8" stroke-width="1.1"/>
  <text x="435" y="167" text-anchor="middle" font-size="9.5" fill="#f38ba8">❌ mount failed</text>

  <!-- Arrow 3→4 -->
  <line x1="513" y1="90" x2="532" y2="90" stroke="#7c6af7" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="532" y="55" width="155" height="70" rx="9" fill="#5b4dd6"/>
  <text x="609"  y="82"  text-anchor="middle" font-size="20" fill="#fff">④</text>
  <text x="609"  y="99"  text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Calculate Size</text>
  <text x="609"  y="114" text-anchor="middle" font-size="9.5" fill="#e0e0ff">usage + 40-unit buffer</text>

  <!-- Arrow 4→5 -->
  <line x1="687" y1="90" x2="706" y2="90" stroke="#7c6af7" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 5 -->
  <rect x="706" y="55" width="155" height="70" rx="9" fill="#5b4dd6"/>
  <text x="783"  y="82"  text-anchor="middle" font-size="20" fill="#fff">⑤</text>
  <text x="783"  y="99"  text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Create Image</text>
  <text x="783"  y="114" text-anchor="middle" font-size="9.5" fill="#e0e0ff">.sparseimage (APFS)</text>

  <!-- Elbow: Step5 right-edge → wrap to Step6 left-edge
       Goes: right → down → left → into Step6 left at y_mid_row2=248 -->
  <polyline
    points="861,90  882,90  882,248  10,248"
    fill="none" stroke="#7c6af7" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════
       ROW 2 — Steps ⑥–⑩   (y=213, left→right)
  ══════════════════════════════════════════ -->

  <!-- Step 6 -->
  <rect x="10"  y="213" width="155" height="70" rx="9" fill="#5b4dd6"/>
  <text x="87"  y="240"  text-anchor="middle" font-size="20" fill="#fff">⑥</text>
  <text x="87"  y="257"  text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Attach Image</text>
  <text x="87"  y="272"  text-anchor="middle" font-size="9.5" fill="#e0e0ff">/Volumes/TargetFolder</text>

  <!-- Arrow 6→7 -->
  <line x1="165" y1="248" x2="184" y2="248" stroke="#7c6af7" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 7 -->
  <rect x="184" y="213" width="155" height="70" rx="9" fill="#5b4dd6"/>
  <text x="261"  y="240"  text-anchor="middle" font-size="20" fill="#fff">⑦</text>
  <text x="261"  y="257"  text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Copy Data</text>
  <text x="261"  y="272"  text-anchor="middle" font-size="9.5" fill="#e0e0ff">rsync snapshot → image</text>

  <!-- Arrow 7→8 -->
  <line x1="339" y1="248" x2="358" y2="248" stroke="#7c6af7" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 8 -->
  <rect x="358" y="213" width="155" height="70" rx="9" fill="#5b4dd6"/>
  <text x="435"  y="240"  text-anchor="middle" font-size="20" fill="#fff">⑧</text>
  <text x="435"  y="257"  text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Write Log</text>
  <text x="435"  y="272"  text-anchor="middle" font-size="9.5" fill="#e0e0ff">.rsync.log</text>

  <!-- Arrow 8→9 -->
  <line x1="513" y1="248" x2="532" y2="248" stroke="#7c6af7" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 9 — Optional UAC -->
  <rect x="532" y="213" width="155" height="70" rx="9" fill="#1e2e1e" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="609" y="233"  text-anchor="middle" font-size="9.5" fill="#a6e3a1" font-style="italic">optional</text>
  <text x="609" y="251"  text-anchor="middle" font-size="20" fill="#a6e3a1">⑨</text>
  <text x="609" y="267"  text-anchor="middle" font-size="11" font-weight="bold" fill="#a6e3a1">UAC Triage</text>
  <text x="609" y="280"  text-anchor="middle" font-size="9.5" fill="#a6e3a1">collect artifacts</text>

  <!-- Arrow 9→10 -->
  <line x1="687" y1="248" x2="706" y2="248" stroke="#7c6af7" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 10 -->
  <rect x="706" y="213" width="155" height="70" rx="9" fill="#5b4dd6"/>
  <text x="783"  y="240"  text-anchor="middle" font-size="20" fill="#fff">⑩</text>
  <text x="783"  y="257"  text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Cleanup</text>
  <text x="783"  y="272"  text-anchor="middle" font-size="9.5" fill="#e0e0ff">unmount snapshot &amp; image</text>

  <!-- Arrow from Step10 → Done (straight down then centre) -->
  <polyline
    points="783,283  783,340  450,340"
    fill="none" stroke="#7c6af7" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════
       DONE bubble
  ══════════════════════════════════════════ -->
  <rect x="375" y="318" width="150" height="50" rx="25" fill="#a6e3a1"/>
  <text x="450" y="346" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e1e2e">✅  Done</text>
  <text x="450" y="360" text-anchor="middle" font-size="9.5" fill="#1e1e2e">Collection complete</text>

  <!-- ═══════════════════════════════════════
       Legend
  ══════════════════════════════════════════ -->
  <rect x="10" y="395" width="370" height="56" rx="7" fill="#27273a"/>
  <rect x="26" y="412" width="16" height="12" rx="3" fill="#7c6af7"/>
  <text x="50" y="423" font-size="10.5" fill="#cdd6f4">Process step</text>
  <rect x="140" y="412" width="16" height="12" rx="3" fill="#1e2e1e" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="164" y="423" font-size="10.5" fill="#cdd6f4">Optional step</text>
  <line x1="268" y1="418" x2="296" y2="418" stroke="#f38ba8" stroke-width="1.8" stroke-dasharray="4 2"/>
  <circle cx="296" cy="418" r="3" fill="#f38ba8"/>
  <text x="304" y="423" font-size="10.5" fill="#cdd6f4">Error exit</text>

</svg>
